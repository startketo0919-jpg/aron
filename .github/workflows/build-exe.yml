name: Build Aron POS Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Vue.js Frontend
        run: |
          cd spa
          npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flaskwebgui waitress whitenoise pyinstaller

      - name: Prepare Database
        run: |
          Copy-Item "db - Copy.sqlite3" -Destination "db.sqlite3" -Force

      - name: Package Application with PyInstaller
        run: |
          python -m PyInstaller --noconsole --name "AronPOS" `
            --collect-all django `
            --collect-all rest_framework `
            --collect-all flaskwebgui `
            --collect-all waitress `
            --hidden-import=core `
            --hidden-import=core.apps `
            --hidden-import=user `
            --hidden-import=user.api `
            --hidden-import=products `
            --hidden-import=taxes `
            --hidden-import=orders `
            --hidden-import=customers `
            --hidden-import=prints `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "aron_settings.json;." `
            --add-data "db.sqlite3;." `
            gui.py

      - name: Copy Database and Settings to Output
        run: |
          Copy-Item "db.sqlite3" -Destination "dist\AronPOS\db.sqlite3" -Force
          Copy-Item "aron_settings.json" -Destination "dist\AronPOS\aron_settings.json" -Force

      - name: Create Zip Package
        run: |
          Compress-Archive -Path dist\AronPOS -DestinationPath AronPOS-Windows.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AronPOS-Windows-Executable
          path: AronPOS-Windows.zip
