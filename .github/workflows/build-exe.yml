name: Build Aron POS Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Vue.js Frontend
        run: |
          cd spa
          npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install waitress whitenoise pyinstaller

      - name: Prepare Database
        run: |
          Copy-Item "db - Copy.sqlite3" -Destination "db.sqlite3" -Force

      - name: Create Native Desktop Launcher
        run: |
          @'
          import os
          import sys
          import time
          import subprocess
          import threading
          from waitress import serve
          from whitenoise import WhiteNoise
          from app.wsgi import application as django_app

          app = WhiteNoise(django_app)
          if os.path.exists("static"):
              app.add_files("static", prefix="/static/")

          def start_server():
              serve(app, host="127.0.0.1", port=8000, threads=8)

          def launch_browser():
              url = "http://127.0.0.1:8000"
              time.sleep(1.5)
              
              edge_paths = [
                  r"C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
                  r"C:\Program Files\Microsoft\Edge\Application\msedge.exe",
                  r"C:\Program Files\Google\Chrome\Application\chrome.exe",
                  r"C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
              ]
              
              browser_exe = None
              for path in edge_paths:
                  if os.path.exists(path):
                      browser_exe = path
                      break
                      
              if browser_exe:
                  proc = subprocess.Popen([browser_exe, f"--app={url}", "--window-size=1200,800"])
                  proc.wait()
                  os._exit(0)
              else:
                  import webbrowser
                  webbrowser.open(url)

          if __name__ == "__main__":
              t = threading.Thread(target=start_server, daemon=True)
              t.start()
              launch_browser()
          '@ | Set-Content -Path gui.py -Encoding utf8

      - name: Package Application with PyInstaller
        run: |
          python -m PyInstaller --noconsole --name "AronPOS" `
            --collect-all django `
            --collect-all rest_framework `
            --collect-all waitress `
            --collect-all whitenoise `
            --hidden-import=core `
            --hidden-import=core.apps `
            --hidden-import=user `
            --hidden-import=user.api `
            --hidden-import=products `
            --hidden-import=taxes `
            --hidden-import=orders `
            --hidden-import=customers `
            --hidden-import=prints `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "aron_settings.json;." `
            --add-data "db.sqlite3;." `
            gui.py

      - name: Copy Database and Settings to Output
        run: |
          Copy-Item "db.sqlite3" -Destination "dist\AronPOS\db.sqlite3" -Force
          Copy-Item "aron_settings.json" -Destination "dist\AronPOS\aron_settings.json" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AronPOS-Windows
          path: dist/AronPOS
