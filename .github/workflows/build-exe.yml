name: Build Aron POS Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Vue.js Frontend
        run: |
          cd spa
          npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install waitress whitenoise psutil pyinstaller
          curl.exe -s -L "https://files.pythonhosted.org/packages/05/b4/e2cf0f44f3499da94aa5c423a247cdfcb973002bd62372c85cca774521b3/flaskwebgui-1.1.8-py3-none-any.whl" -o flaskwebgui.zip
          tar -xf flaskwebgui.zip flaskwebgui.py

      - name: Prepare Database
        run: |
          Copy-Item "db - Copy.sqlite3" -Destination "db.sqlite3" -Force

      - name: Package Application with PyInstaller
        run: |
          python -m PyInstaller --noconsole --name "AronPOS" `
            --collect-all django `
            --collect-all rest_framework `
            --hidden-import=flaskwebgui `
            --hidden-import=waitress `
            --hidden-import=whitenoise `
            --hidden-import=psutil `
            --hidden-import=core `
            --hidden-import=core.apps `
            --hidden-import=user `
            --hidden-import=user.api `
            --hidden-import=products `
            --hidden-import=taxes `
            --hidden-import=orders `
            --hidden-import=customers `
            --hidden-import=prints `
            --add-data "flaskwebgui.py;." `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "aron_settings.json;." `
            --add-data "db.sqlite3;." `
            gui.py

      - name: Copy Database and Settings to Output
        run: |
          Copy-Item "db.sqlite3" -Destination "dist\AronPOS\db.sqlite3" -Force
          Copy-Item "aron_settings.json" -Destination "dist\AronPOS\aron_settings.json" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AronPOS-Windows
          path: dist/AronPOS
