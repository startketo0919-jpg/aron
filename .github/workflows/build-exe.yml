name: Build Aron POS Windows Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Vue.js Frontend
        run: |
          cd spa
          npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install waitress whitenoise pyinstaller

      - name: Prepare Database
        run: |
          Copy-Item "db - Copy.sqlite3" -Destination "db.sqlite3" -Force

      - name: Create Native Desktop Launcher
        run: |
          @'
          import os
          import sys
          import time
          import socket
          import subprocess
          import threading

          # Must be set BEFORE any Django imports
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "app.settings")

          # Tell Django where the project root is (for finding templates, static, db)
          BASE_DIR = os.path.dirname(os.path.abspath(sys.executable if getattr(sys, "frozen", False) else __file__))
          if getattr(sys, "frozen", False):
              os.chdir(BASE_DIR)

          from waitress import serve
          from whitenoise import WhiteNoise
          from app.wsgi import application as django_app

          PORT = 8000

          def wait_for_server(host, port, timeout=30):
              """Wait until the server is actually accepting connections."""
              start = time.time()
              while time.time() - start < timeout:
                  try:
                      with socket.create_connection((host, port), timeout=1):
                          return True
                  except (ConnectionRefusedError, OSError):
                      time.sleep(0.3)
              return False

          def start_server():
              app = WhiteNoise(django_app)
              serve(app, host="127.0.0.1", port=PORT, threads=8)

          def launch_browser():
              url = f"http://127.0.0.1:{PORT}"
              wait_for_server("127.0.0.1", PORT)

              edge_paths = [
                  r"C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
                  r"C:\Program Files\Microsoft\Edge\Application\msedge.exe",
                  r"C:\Program Files\Google\Chrome\Application\chrome.exe",
                  r"C:\Program Files (x86)\Google\Chrome\Application\chrome.exe",
              ]

              browser_exe = None
              for path in edge_paths:
                  if os.path.exists(path):
                      browser_exe = path
                      break

              if browser_exe:
                  proc = subprocess.Popen([
                      browser_exe,
                      f"--app={url}",
                      "--window-size=1280,800",
                      "--disable-extensions",
                  ])
                  proc.wait()
              else:
                  import webbrowser
                  webbrowser.open(url)
                  input("Press Enter to quit...")

              os._exit(0)

          if __name__ == "__main__":
              server_thread = threading.Thread(target=start_server, daemon=True)
              server_thread.start()
              launch_browser()
          '@ | Set-Content -Path gui.py -Encoding utf8
